name: Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Probe CodeMie gateway
        run: |
          echo "Token length: ${#JOBPILOT_CODEMIE_TOKEN}"
          STATUS=$(node --input-type=module << 'EOF'
          const token = process.env.JOBPILOT_CODEMIE_TOKEN ?? '';
          const resp = await fetch('https://codemie.lab.epam.com/code-assistant-api/v1/messages', {
            method: 'POST',
            headers: {
              'x-api-key': 'proxy-handled',
              'cookie': '_oauth2_proxy=' + token,
              'anthropic-version': '2023-06-01',
              'content-type': 'application/json',
            },
            body: JSON.stringify({ model: 'claude-haiku-4-5-20251001', max_tokens: 5, messages: [{ role: 'user', content: 'hi' }] }),
          });
          console.log(resp.status);
          const body = await resp.text();
          console.log(body.slice(0, 200));
          EOF
          )
          echo "$STATUS"
        env:
          JOBPILOT_CODEMIE_TOKEN: ${{ secrets.JOBPILOT_CODEMIE_TOKEN }}

      - name: Run pipeline
        run: npm run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JOBPILOT_CODEMIE_TOKEN: ${{ secrets.JOBPILOT_CODEMIE_TOKEN }}
          CODEMIE_BASE_URL: ${{ secrets.CODEMIE_BASE_URL }}
          DIGEST_EMAIL_FROM: ${{ vars.DIGEST_EMAIL_FROM }}
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
